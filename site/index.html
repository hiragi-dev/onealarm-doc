<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OneAlarm — 絶対に電源を切れないアラーム</title>
    <meta
      name="description"
      content="低コストで簡単に構築できる、絶対に電源を切れないアラーム。M5StickS3 とアプリだけで作る二度寝防止アラームです。"
    />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // 既定はホワイト。保存された設定を描画前に反映してちらつきを防ぐ
      try {
        var t = localStorage.getItem('onealarm-theme')
        document.documentElement.dataset.theme = t === 'dark' ? 'dark' : 'light'
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
